name: SaaS MVP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-api-finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api-finance/pyproject.toml
      - name: Install dependencies
        run: |
          cd api-finance
          pip install -e ".[test]"
      - name: Run tests
        run: |
          cd api-finance
          pytest -v

  test-reddit-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: reddit-validator/pyproject.toml
      - name: Install dependencies
        run: |
          cd reddit-validator
          pip install -e ".[test]"
      - name: Run tests
        run: |
          cd reddit-validator
          pytest -v

  test-boilerplate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: boilerplate-saas/package-lock.json
      - name: Install dependencies
        run: |
          cd boilerplate-saas
          npm install --legacy-peer-deps
      - name: Run tests
        run: |
          cd boilerplate-saas
          npm test

  build-and-push:
    needs: [test-api-finance, test-reddit-validator, test-boilerplate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker compose build
      - name: Push to GHCR (optional)
        if: github.event_name == 'push'
        run: |
          echo "TODO: docker push ghcr.io/${{ github.repository_owner }}/saas-mvp"
